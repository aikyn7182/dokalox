<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Spreadsheet Studio — Электрондық кесте зертханасы</title>
<style>
:root{
  --bg:#FDFBF7; --surface:#fff; --ink:#1F2A24; --muted:#6B7A72;
  --green:#1B5E43; --green2:#2E8B62; --gsoft:#E8F5EF;
  --coral:#FF6B5B; --csoft:#FFEDEA;
  --yellow:#FFC93C; --ysoft:#FFF6DC;
  --cyan:#3EC6D9; --cysouth:#E4F7FA;
  --line:#E6E2DA; --r:16px; --sh:0 4px 18px rgba(27,94,67,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;font-size:16px}
h1,h2,h3,h4{line-height:1.3;margin:0 0 .5em}
h1{font-size:1.9rem;color:var(--green)}
h2{font-size:1.4rem;color:var(--green)}
h3{font-size:1.15rem;color:var(--green)}
h4{font-size:1rem;color:var(--green2);margin-top:1.2em}
p{margin:.5em 0}
a{color:var(--green2)}
ul,ol{margin:.4em 0 .8em;padding-left:1.3em}
li{margin:.25em 0}

/* HEADER */
header{position:sticky;top:0;z-index:50;background:rgba(253,251,247,.95);backdrop-filter:blur(8px);border-bottom:2px solid var(--gsoft)}
.hwrap{max-width:1140px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--green);cursor:pointer;font-size:1.05rem}
.logo .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--green),var(--green2));display:grid;place-items:center;color:#fff;font-size:16px;box-shadow:var(--sh)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.navb{border:none;background:transparent;color:var(--muted);padding:7px 12px;border-radius:10px;cursor:pointer;font-size:.9rem;font-weight:600;font-family:inherit;transition:.18s}
.navb:hover{background:var(--gsoft);color:var(--green)}
.navb.on{background:var(--green);color:#fff}

/* LAYOUT */
main{max-width:1140px;margin:0 auto;padding:24px 16px 80px}
.card{background:var(--surface);border-radius:var(--r);padding:20px 22px;box-shadow:var(--sh);border:1px solid var(--line);margin-bottom:18px}
.card.pastel-g{background:var(--gsoft);border-color:#D3EBE0}
.card.pastel-c{background:var(--csoft);border-color:#FBD9D3}
.card.pastel-y{background:var(--ysoft);border-color:#F7E6B4}
.card.pastel-cy{background:var(--cysouth);border-color:#C7EBF1}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.btn{display:inline-block;border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:.95rem;padding:11px 20px;border-radius:12px;background:var(--green);color:#fff;transition:.18s;text-decoration:none}
.btn:hover{background:var(--green2);transform:translateY(-1px)}
.btn.alt{background:var(--coral)}
.btn.alt:hover{background:#e85a4a}
.btn.ghost{background:#fff;color:var(--green);border:2px solid var(--gsoft)}
.btn.ghost:hover{background:var(--gsoft)}
.btn.y{background:var(--yellow);color:#5A4400}
.btn.sm{padding:7px 14px;font-size:.85rem}
.pill{display:inline-block;background:var(--gsoft);color:var(--green);border-radius:999px;padding:3px 12px;font-size:.78rem;font-weight:700}
.pill.c{background:var(--csoft);color:#B33A2A}
.pill.y{background:var(--ysoft);color:#8A6A00}
.pill.cy{background:var(--cysouth);color:#1C7C8C}
.muted{color:var(--muted)}
.small{font-size:.87rem}

/* HOME HERO */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center}
@media(max-width:800px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:2.1rem;margin-bottom:.3em}
.hero .sub{font-size:1.05rem;color:var(--muted);margin-bottom:1.2em}
.sec-label{color:var(--coral);font-weight:800;letter-spacing:.5px;font-size:.85rem;margin-bottom:6px}

/* SHEET */
table.sheet{border-collapse:collapse;background:#fff;font-size:.9rem;width:100%}
table.sheet th{background:#F1F5F3;color:var(--green);font-weight:700;padding:6px 8px;border:1px solid var(--line);text-align:center;min-width:52px;font-size:.82rem}
table.sheet td{border:1px solid var(--line);padding:0;height:34px}
table.sheet td.cell{cursor:pointer;padding:0 8px;color:var(--ink)}
table.sheet td.cell.sel{outline:2px solid var(--green2);outline-offset:-2px;background:#F0FAF5}
table.sheet input.cellin{width:100%;height:100%;border:none;padding:8px 9px;font:inherit;font-size:.9rem;background:transparent;outline:none;min-width:70px}
table.sheet input.cellin:focus{outline:2px solid var(--green2);outline-offset:-2px;background:#F5FCF9}
td.calc{background:#F4FBF7;color:var(--green);font-weight:700;padding:8px 9px;text-align:right}
.sheetwrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:#fff}
table.demo{border-collapse:collapse;width:100%;font-size:.9rem;margin:.6em 0}
table.demo th{background:var(--green);color:#fff;padding:8px 10px;border:1px solid #DDE7E2;text-align:left;font-weight:700}
table.demo td{border:1px solid var(--line);padding:8px 10px;background:#fff}
table.demo tr:nth-child(even) td{background:#FAFCFB}

/* TASKS */
.task{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.task h4{color:var(--green);margin-top:0}
.field{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:9px 0}
.field label{flex:1 1 240px;font-size:.93rem}
.field input{flex:0 0 200px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:.92rem;background:#fff}
.field input:focus{outline:none;border-color:var(--green2);box-shadow:0 0 0 3px #DDF2E9}
.field.ok input{border-color:#2E8B62;background:#F1FAF5}
.field.no input{border-color:var(--coral);background:#FFF4F2}
.mark{font-weight:800;font-size:1.05rem;width:20px;text-align:center}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:.92rem}
.fb.good{background:var(--gsoft);color:var(--green);border:1px solid #C9E7DA}
.fb.bad{background:var(--csoft);color:#A93A2A;border:1px solid #F7D2CB}
.fb ul{margin:.4em 0 0;padding-left:1.1em}

/* TEST */
.test{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px}
.q{padding:12px 0;border-bottom:1px dashed var(--line)}
.q:last-of-type{border-bottom:none}
.q p{margin:0 0 .5em;font-weight:600}
.opt{display:block;padding:7px 10px;border-radius:9px;cursor:pointer;font-size:.93rem;margin:3px 0;transition:.15s}
.opt:hover{background:var(--gsoft)}
.opt input{margin-right:9px}
.opt.correct{background:#E4F6EC;color:#186B47;font-weight:700}
.opt.wrong{background:#FFE9E5;color:#B33A2A}
.res{margin-top:14px;padding:16px;border-radius:14px;background:var(--gsoft);border:1px solid #CDE9DC}
.res h4{margin-top:0}
.big{font-size:1.6rem;font-weight:800;color:var(--green)}
.bar{height:12px;border-radius:999px;background:#E4EFE9;overflow:hidden;margin:8px 0}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--green2),var(--cyan));border-radius:999px;transition:width .5s}

/* CHIPS */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-size:.85rem;font-weight:600;cursor:pointer;color:var(--muted);font-family:inherit}
.chip:hover{border-color:var(--green2);color:var(--green)}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}

/* TOPIC CARD */
.tcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;transition:.18s;display:flex;flex-direction:column;gap:6px}
.tcard:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(27,94,67,.12);border-color:#CDE9DC}
.tcard .ico{font-size:1.7rem}
.tcard .code{font-weight:800;color:var(--coral);font-size:.82rem}
.tcard .tt{font-weight:700;color:var(--green);font-size:.98rem}
.tcard .st{font-size:.8rem;color:var(--muted)}

/* PROGRESS */
.prow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.prow:last-child{border-bottom:none}
.chart{width:100%;height:auto;max-height:260px}
.note{font-size:.85rem;color:var(--muted);background:#F7F5F0;border-left:4px solid var(--yellow);padding:10px 14px;border-radius:8px;margin:10px 0}
footer{border-top:2px solid var(--gsoft);padding:24px 16px;text-align:center;color:var(--muted);font-size:.85rem}
.crumb{font-size:.85rem;color:var(--muted);margin-bottom:10px}
.crumb b{color:var(--green)}
.nav-end{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}
.stars{display:flex;gap:8px;font-size:1.6rem;cursor:pointer;user-select:none}
.stars span{filter:grayscale(1);opacity:.45;transition:.15s}
.stars span.on{filter:none;opacity:1;transform:scale(1.1)}
</style>
</head>
<body>

<header>
  <div class="hwrap">
    <div class="logo" onclick="go('home')">
      <div class="mark">▦</div>
      <div>Spreadsheet Studio<br><span style="font-weight:500;font-size:.72rem;color:#6B7A72">Электрондық кесте зертханасы</span></div>
    </div>
    <nav id="nav"></nav>
  </div>
</header>

<main id="view"></main>

<footer>
  Spreadsheet Studio · 6-сынып информатика · III бөлім «Электрондық кесте арқылы есеп шығару»<br>
  Нәтижелер осы браузерде (localStorage) сақталады.
</footer>

<script>
/* ============================================================
   1. КӨМЕКШІ ФУНКЦИЯЛАР
   ============================================================ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];

function norm(s){
  return String(s==null?'':s).toLowerCase().trim()
    .replace(/[«»"'`]/g,'')
    .replace(/\s+/g,' ')
    .replace(/[.,;!?]+$/,'')
    .replace(/ё/g,'е');
}
function match(inp, ans){
  const a = norm(inp), b = norm(ans);
  if(a === b) return true;
  const na = parseFloat(a.replace(/\s/g,'').replace(',','.'));
  const nb = parseFloat(b.replace(/\s/g,'').replace(',','.'));
  if(!isNaN(na) && !isNaN(nb)){
    const cleanA = a.replace(/[0-9\s.,\-]/g,'');
    const cleanB = b.replace(/[0-9\s.,\-]/g,'');
    if(cleanA==='' && cleanB==='') return na === nb;
  }
  return false;
}
function q(text, options, correct){ return {text, options, correct}; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ============================================================
   2. САҚТАУ (localStorage)
   ============================================================ */
const KEY = 'spreadsheet_studio_kk_v1';
const store = {
  data: {topics:{}, practice:{}, final:null},
  load(){
    try{
      const raw = localStorage.getItem(KEY);
      if(raw) this.data = Object.assign({topics:{},practice:{},final:null}, JSON.parse(raw));
    }catch(e){}
    return this.data;
  },
  save(){ try{ localStorage.setItem(KEY, JSON.stringify(this.data)); }catch(e){} },
  topic(id){
    if(!this.data.topics[id]) this.data.topics[id] = {test:null, self:0, done:false};
    return this.data.topics[id];
  },
  reset(){
    this.data = {topics:{}, practice:{}, final:null};
    this.save();
  }
};
store.load();

/* ============================================================
   3. ОҚУ МАЗМҰНЫ — 7 ТАҚЫРЫП
   ============================================================ */
const TOPICS = [
/* ---------------------------- 3.1 ---------------------------- */
{
  id:'t1', code:'3.1', icon:'📄', title:'Мәтіндік процессордағы кестелер',
  goal:'Кестенің құрылымын (жол, баған, ұяшық) түсіну; мәтіндік процессорда кесте құру, оған мәтін енгізу, жол мен бағанды қосу-жою, ұяшықтарды біріктіру және кестені безендіру тәсілдерін меңгеру.',
  theory:`
    <h4>1. Кесте дегеніміз не?</h4>
    <p><b>Кесте</b> — ақпаратты жолдар мен бағандар бойынша реттелген түрде беретін құрылым. Кесте көптеген деректі ықшам, көрнекі және салыстыруға қолайлы етіп көрсетеді.</p>
    <h4>2. Кестенің негізгі бөліктері</h4>
    <ul>
      <li><b>Жол</b> — кестенің көлденең қатары.</li>
      <li><b>Баған</b> — кестенің тік қатары.</li>
      <li><b>Ұяшық</b> — жол мен бағанның қиылысында пайда болатын бөлік. Ұяшыққа мәтін, сан, күн немесе сурет енгізуге болады.</li>
      <li><b>Тақырып жолы</b> — әдетте кестенің ең жоғарғы жолы; онда бағандардың атауы жазылады.</li>
    </ul>
    <h4>3. Мәтіндік процессорда кесте құру</h4>
    <p>Кесте құру үшін <b>Кірістіру → Кесте</b> командасы қолданылады. Ашылған тордан қажетті жол мен баған санын таңдаймыз. «Кесте құру» терезесінде баған санын нақты санмен де енгізуге болады.</p>
    <h4>4. Кестеге мәтін енгізу</h4>
    <p>Ұяшықты тінтуірмен шертіп, пернетақтадан мәтінді тереміз. <b>Tab</b> пернесі келесі ұяшыққа, ал көрсеткіш пернелері көршілес ұяшыққа өткізеді.</p>
    <h4>5. Жолдар мен бағандарды қосу және жою</h4>
    <ul>
      <li>Қосу: ұяшықты таңдап, <b>Кесте құралдары → Орналасу → Жоғарыға жол қосу / Солға баған қосу</b>.</li>
      <li>Жою: ұяшықты таңдап, <b>Жолды жою</b> немесе <b>Бағанды жою</b> командасын қолдану.</li>
      <li>Бұл әрекеттерді контекстік мәзір (оң жақ түймені шерту) арқылы да орындауға болады.</li>
    </ul>
    <h4>6. Ұяшықтарды біріктіру</h4>
    <p>Бірнеше ұяшықты бір ұяшыққа айналдыру <b>Ұяшықтарды біріктіру</b> командасымен орындалады. Біріктіру көбінесе кесте тақырыбын жазғанда қолданылады. Кері әрекет — <b>Біріктіруді болдырмау</b>.</p>
    <h4>7. Кестені безендіру</h4>
    <p>Кестені оқуға ыңғайлы ету үшін қаріп түрін, өлшемін және түсін өзгертеміз; тақырып жолын қалың қаріппен жазамыз; ұяшықтарға фон түсін береміз; шекаралар қоямыз. Дайын үлгілерді <b>Кесте стильдері</b> бөлімінен таңдауға болады.</p>
    <h4>8. Кестені ақпаратты жүйелеу үшін пайдалану</h4>
    <p>Кесте деректерді салыстыруға, топтауға және талдауға мүмкіндік береді: сабақ кестесі, бағалар журналы, күн тәртібі, тауар тізімі — осының бәрі кесте түрінде ыңғайлы беріледі.</p>
  `,
  examples:`
    <p><b>Мысал: «Оқушының апталық сабақ кестесі».</b></p>
    <table class="demo">
      <tr><th>Күн</th><th>1-сабақ</th><th>2-сабақ</th><th>3-сабақ</th></tr>
      <tr><td>Дүйсенбі</td><td>Математика</td><td>Қазақ тілі</td><td>Информатика</td></tr>
      <tr><td>Сейсенбі</td><td>Информатика</td><td>Тарих</td><td>Ағылшын тілі</td></tr>
    </table>
    <p>Мұнда <b>4 баған</b> (Күн, 1-сабақ, 2-сабақ, 3-сабақ) және <b>3 жол</b> (тақырып жолы + 2 күн) бар. Әр ұяшықта нақты бір дерек жазылған. Тақырып жолы қалың қаріппен және көк фонмен ерекшеленген — бұл кестені оқуға ыңғайлы етеді.</p>
  `,
  remember:'Кесте жол, баған және ұяшықтан тұрады. Ұяшық — жол мен бағанның қиылысы. Кестенің бірінші жолы көбінесе тақырып жолы болады. Ұяшықтарды біріктіру кесте тақырыбын жазу үшін қолданылады.',
  tasks:[
    {
      title:'1-тапсырма. Кестені құрастыр',
      desc:'Төмендегі деректерді пайдаланып, апталық сабақ кестесінің бос ұяшықтарын <b>жазбаша</b> толтыр. Әр ұяшыққа тек пән атауын жаз.',
      note:'Деректер: Дүйсенбі — 1-сабақ: Математика, 2-сабақ: Қазақ тілі. Сейсенбі — 1-сабақ: Информатика, 2-сабақ: Тарих.',
      html:`
        <div class="sheetwrap">
          <table class="sheet">
            <tr><th></th><th>A</th><th>B</th><th>C</th></tr>
            <tr><th>1</th><td class="calc" style="text-align:left">Күн</td><td class="calc" style="text-align:left">1-сабақ</td><td class="calc" style="text-align:left">2-сабақ</td></tr>
            <tr><th>2</th><td class="calc" style="text-align:left">Дүйсенбі</td><td><input class="cellin" data-f="0" placeholder="B2"></td><td><input class="cellin" data-f="1" placeholder="C2"></td></tr>
            <tr><th>3</th><td class="calc" style="text-align:left">Сейсенбі</td><td><input class="cellin" data-f="2" placeholder="B3"></td><td><input class="cellin" data-f="3" placeholder="C3"></td></tr>
          </table>
        </div>`,
      fields:[
        {label:'B2 ұяшығы (Дүйсенбі, 1-сабақ)', a:['математика']},
        {label:'C2 ұяшығы (Дүйсенбі, 2-сабақ)', a:['қазақ тілі','казак тили']},
        {label:'B3 ұяшығы (Сейсенбі, 1-сабақ)', a:['информатика']},
        {label:'C3 ұяшығы (Сейсенбі, 2-сабақ)', a:['тарих']}
      ]
    },
    {
      title:'2-тапсырма. Қатені тап',
      desc:'Төмендегі кестеде бір ұяшықта қате бар: баға санмен емес, мәтінмен жазылған. Қате тұрған ұяшықтың мекенжайын жаз, содан кейін оны дұрыс санмен жаз.',
      html:`

/* SVG диаграммалар */
function barSVG(data){
  const w = 460, h = 220, pad = 34, base = h - 34;
  const max = Math.max(...data.map(d=>d.v), 1);
  const step = (w - pad - 20) / data.length;
  const bw = Math.min(58, step - 18);
  let s = '';
  data.forEach((d,i)=>{
    const x = pad + i*step + (step-bw)/2;
    const bh = Math.max(2, (d.v/max) * (base - 26));
    const y = base - bh;
    s += '<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="7" fill="'+(d.c||'#2E8B62')+'"/>';
    s += '<text x="'+(x+bw/2)+'" y="'+(y-7)+'" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2A24">'+d.v+'</text>';
    s += '<text x="'+(x+bw/2)+'" y="'+(h-12)+'" text-anchor="middle" font-size="11" fill="#6B7A72">'+esc(d.k)+'</text>';
  });
  s += '<line x1="'+pad+'" y1="'+base+'" x2="'+(w-10)+'" y2="'+base+'" stroke="#E6E2DA" stroke-width="2"/>';
  return '<svg viewBox="0 0 '+w+' '+h+'" class="chart">'+s+'</svg>';
}
function lineSVG(data){
  const w = 460, h = 220, pad = 38, base = h - 34;
  const vals = data.map(d=>d.v);
  const max = Math.max(...vals, 1), min = Math.min(...vals, 0);
  const range = (max - min) || 1;
  const step = (w - pad - 20) / Math.max(data.length - 1, 1);
  const pts = data.map((d,i)=>{
    const x = pad + i*step;
    const y = base - ((d.v - min)/range) * (base - 34);
    return [x, y, d.v, d.k];
  });
  let s = '';
  s += '<polyline points="'+pts.map(p=>p[0]+','+p[1]).join(' ')+'" fill="none" stroke="#FF6B5B" stroke-width="3" stroke-linejoin="round"/>';
  pts.forEach(p=>{
    s += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="5" fill="#fff" stroke="#FF6B5B" stroke-width="3"/>';
    s += '<text x="'+p[0]+'" y="'+(p[1]-12)+'" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2A24">'+p[2]+'</text>';
    s += '<text x="'+p[0]+'" y="'+(h-12)+'" text-anchor="middle" font-size="11" fill="#6B7A72">'+esc(p[3])+'</text>';
  });
  s += '<line x1="'+pad+'" y1="'+base+'" x2="'+(w-10)+'" y2="'+base+'" stroke="#E6E2DA" stroke-width="2"/>';
  return '<svg viewBox="0 0 '+w+' '+h+'" class="chart">'+s+'</svg>';
}

/* Виджеттерді іске қосу */
function initWidgets(root){
  /* sum */
  const sw = $('[data-widget="sum"]', root);
  if(sw){
    const upd = ()=>{ $('.sum-out', sw).textContent = currentSum(); };
    $$('.sum-in', sw).forEach(i=>i.addEventListener('input', upd));
    upd();
  }
  /* shop */
  const shw = $('[data-widget="shop"]', root);
  if(shw){
    const upd = ()=>{
      const rows = shopRows();
      $$('.shop-r', shw).forEach((td,i)=>{ td.textContent = rows[i]; });
      $('.shop-total', shw).textContent = shopTotal();
    };
    $$('.shop-q, .shop-p', shw).forEach(i=>i.addEventListener('input', upd));
    upd();
  }
  /* week */
  const ww = $('[data-widget="week"]', root);
  if(ww){
    const upd = ()=>{ $('.week-sum', ww).textContent = weekSum(); };
    $$('.week-in', ww).forEach(i=>i.addEventListener('input', upd));
    upd();
  }
  /* chart */
  const cw = $('[data-widget="chart"]', root);
  if(cw){
    const upd = ()=>{
      const data = chartVals().map((v,i)=>({k:chartKeys()[i], v:v, c:'#2E8B62'}));
      $('.chart-out', cw).innerHTML = barSVG(data);
    };
    $$('.chart-in', cw).forEach(i=>i.addEventListener('input', upd));
    upd();
  }
  /* temp */
  const tw = $('[data-widget="temp"]', root);
  if(tw){
    const upd = ()=>{
      const data = tempVals().map((v,i)=>({k:tempKeys()[i], v:v}));
      $('.chart-out', tw).innerHTML = lineSVG(data);
    };
    $$('.temp-in', tw).forEach(i=>i.addEventListener('input', upd));
    upd();
  }
  /* budget */
  const bw = $('[data-widget="budget"]', root);
  if(bw){
    const upd = ()=>{
      $('.bud-out', bw).textContent = budOut();
      $('.bud-rest', bw).textContent = budRest();
    };
    $$('.bud-in', bw).forEach(i=>i.addEventListener('input', upd));
    upd();
  }
}

function taskBlock(task, idx){
  const hasHtmlInputs = task.html && task.html.indexOf('data-f=') !== -1;
  let h = '<div class="task" data-task="'+idx+'">';
  h += '<h4>'+task.title+'</h4>';
  h += '<p>'+task.desc+'</p>';
  if(task.note) h += '<div class="note">'+task.note+'</div>';
  if(task.html) h += task.html;
  if(!hasHtmlInputs){
    h += '<div class="fields">';
    task.fields.forEach((f,i)=>{
      h += '<div class="field" data-fi="'+i+'"><label>'+(i+1)+') '+f.label+'</label>'
        + '<input type="text" data-f="'+i+'" placeholder="'+(f.ph||'жауабыңды жаз')+'">'
        + '<span class="mark"></span></div>';
    });
    h += '</div>';
  }
  h += '<div style="margin-top:12px"><button class="btn" data-check-task>Тексеру</button> '
     + '<button class="btn ghost sm" data-clear-task>Тазалау</button></div>';
  h += '<div class="fb" data-task-fb style="display:none"></div>';
  h += '</div>';
  return h;
}

function checkTask(box, task){
  const inputs = $$('[data-f]', box);
  let correct = 0;
  const details = [];
  inputs.forEach(inp=>{
    const i = parseInt(inp.dataset.f, 10);
    const f = task.fields[i];
    if(!f) return;
    const answers = (typeof f.a === 'function') ? f.a() : f.a;
    const val = inp.value;
    let ok = false;
    if(String(val).trim() !== ''){
      ok = answers.some(a=> match(val, a));
    }
    if(ok) correct++;
    details.push({label:f.label, ok:ok, val:val, ans:answers[0]});
    /* визуал */
    const fieldEl = inp.closest('.field');
    if(fieldEl){
      fieldEl.classList.toggle('ok', ok);
      fieldEl.classList.toggle('no', !ok);
      const m = $('.mark', fieldEl);
      if(m) m.textContent = ok ? '✓' : '✗';
    }else{
      inp.style.borderColor = ok ? '#2E8B62' : '#FF6B5B';
      inp.style.background = ok ? '#F1FAF5' : '#FFF4F2';
    }
  });
  const total = task.fields.length;
  const fb = $('[data-task-fb]', box);
  fb.style.display = 'block';
  const pct = Math.round(correct/total*100);
  let cls = pct === 100 ? 'good' : (pct >= 60 ? 'good' : 'bad');
  let msg = '';
  if(pct === 100) msg = '🎉 Керемет! Барлық жауап дұрыс ('+correct+'/'+total+').';
  else if(pct >= 60) msg = '👍 Жақсы! Дұрыс жауап: '+correct+'/'+total+'. Қателерді түзетіп көр.';
  else msg = '📚 Дұрыс жауап: '+correct+'/'+total+'. Теорияны қайталап, тағы көр.';
  let list = '';
  details.forEach((d,i)=>{
    if(!d.ok){
      list += '<li>«'+esc(d.label)+'» — сенің жауабың: <b>'+(d.val?esc(d.val):'бос')+'</b>. Дұрыс жауап: <b>'+esc(d.ans)+'</b></li>';
    }
  });
  fb.className = 'fb ' + cls;
  fb.innerHTML = '<b>'+msg+'</b>' + (list ? '<ul>'+list+'</ul>' : '');
}

function testBlock(questions, key, title){
  let h = '<div class="test" data-test="'+key+'">';
  h += '<h3>'+title+'</h3>';
  h += '<p class="small muted">'+questions.length+' сұрақ · әр сұрақта бір дұрыс жауап</p>';
  questions.forEach((qq,qi)=>{
    h += '<div class="q" data-qi="'+qi+'"><p>'+(qi+1)+'. '+qq.text+'</p>';
    qq.options.forEach((op,oi)=>{
      h += '<label class="opt"><input type="radio" name="'+key+'-q'+qi+'" value="'+oi+'">'+op+'</label>';
    });
    h += '</div>';
  });
  h += '<div style="margin-top:14px"><button class="btn" data-check-test>Тестті тексеру</button> '
     + '<button class="btn ghost sm" data-retry-test>Қайта тапсыру</button></div>';
  h += '<div data-test-res></div>';
  h += '</div>';
  return h;
}

function checkTest(box, questions, key, onSave){
  const resBox = $('[data-test-res]', box);
  let correct = 0, answered = 0;
  const wrong = [];
  questions.forEach((qq,qi)=>{
    const sel = $('input[name="'+key+'-q'+qi+'"]:checked', box);
    const qEl = $('[data-qi="'+qi+'"]', box);
    $$('.opt', qEl).forEach(o=>o.classList.remove('correct','wrong'));
    const correctLabel = $$('.opt', qEl)[qq.correct];
    if(correctLabel) correctLabel.classList.add('correct');
    if(sel){
      answered++;
      const v = parseInt(sel.value,10);
      if(v === qq.correct){ correct++; }
      else {
        const l = $$('.opt', qEl)[v];
        if(l) l.classList.add('wrong');
        wrong.push({n:qi+1, text:qq.text, my:qq.options[v], right:qq.options[qq.correct]});
      }
    }else{
      wrong.push({n:qi+1, text:qq.text, my:'(жауап берілмеді)', right:qq.options[qq.correct]});
    }
  });
  const total = questions.length;
  const pct = Math.round(correct/total*100);
  let grade = '';
  if(pct >= 90) grade = 'Өте жақсы! 🏆';
  else if(pct >= 75) grade = 'Жақсы! 👍';
  else if(pct >= 50) grade = 'Қайталап оқы. 📖';
  else grade = 'Теорияны қайта қарап, тағы тапсыр. 📚';

  let h = '<div class="res">';
  h += '<h4>Нәтиже</h4>';
  h += '<p class="big">'+pct+'%</p>';
  h += '<div class="bar"><i style="width:'+pct+'%"></i></div>';
  h += '<p><b>Дұрыс жауап:</b> '+correct+' &nbsp;·&nbsp; <b>Қате жауап:</b> '+(total-correct)+' &nbsp;·&nbsp; <b>Жауап берілген:</b> '+answered+'/'+total+'</p>';
  h += '<p><b>Баға:</b> '+grade+'</p>';
  if(answered < total) h += '<p class="small">⚠️ Кейбір сұрақтарға жауап берілмеді.</p>';
  h += '</div>';

  if(wrong.length){
    h += '<div class="res" style="background:#FFF6F4;border-color:#F7D2CB;margin-top:12px">';
    h += '<h4 style="color:#B33A2A">Қате жауаптарды қайта қарау</h4><ul>';
    wrong.forEach(w=>{
      h += '<li><b>'+w.n+'-сұрақ.</b> '+esc(w.text)+'<br>Сенің жауабың: <span style="color:#B33A2A">'+esc(w.my)+'</span><br>Дұрыс жауап: <span style="color:#186B47;font-weight:700">'+esc(w.right)+'</span></li>';
    });
    h += '</ul></div>';
  }
  resBox.innerHTML = h;
  if(onSave) onSave({correct:correct, total:total, percent:pct});
}

  /* 4. Тапсырмалар */

  h += testBlock(t.test, 'test-'+t.id, t.code+' тақырыбы бойынша тест (10 сұрақ)');
  /* 6. Өзін-өзі бағалау */
  h += '<div class="card pastel-c" style="margin-top:18px">';
  h += '<h3 style="margin-top:0">🌟 Өзін-өзі бағалау</h3>';
  h += '<p class="small">Осы тақырыпты қаншалықты түсіндің? Жұлдызшаларды таңда.</p>';
  h += '<div class="stars" data-stars="'+t.id+'">';
  for(let i=1;i<=5;i++) h += '<span data-v="'+i+'" class="'+(st.self>=i?'on':'')+'">★</span>';
  h += '</div>';
  h += '<p class="small muted" data-star-txt style="margin-top:8px">'+(st.self? 'Бағаң: '+st.self+'/5' : 'Әзірге баға қойылмаған')+'</p>';
  h += '</div>';
  /* 7. Келесі тақырып */
  h += '<div class="nav-end">';
  if(idx > 0) h += '<button class="btn ghost" data-go="topic/'+TOPICS[idx-1].id+'">← '+TOPICS[idx-1].code+'</button>';
  else h += '<span></span>';
  if(idx < TOPICS.length-1) h += '<button class="btn" data-go="topic/'+TOPICS[idx+1].id+'">'+TOPICS[idx+1].code+'. '+TOPICS[idx+1].title.slice(0,26)+'… →</button>';
  else h += '<button class="btn alt" data-go="lab">Практикалық зертхана →</button>';
  h += '</div>';

  view.innerHTML = h;
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});

  initWidgets(view);
  bindGo();

  /* тапсырмалар */
  $$('.task').forEach(box=>{
    const i = parseInt(box.dataset.task,10);
    const task = t.tasks[i];
    $('[data-check-task]', box).addEventListener('click', ()=> checkTask(box, task));
    $('[data-clear-task]', box).addEventListener('click', ()=>{
      $$('[data-f]', box).forEach(inp=>{
        inp.value = '';
        const fe = inp.closest('.field');
        if(fe){ fe.classList.remove('ok','no'); const m=$('.mark',fe); if(m) m.textContent=''; }
        inp.style.borderColor = ''; inp.style.background = '';
      });
      const fb = $('[data-task-fb]', box); fb.style.display='none';
    });
  });

  /* тест */
  const tbox = $('[data-test="test-'+t.id+'"]');
  $('[data-check-test]', tbox).addEventListener('click', ()=>{
    checkTest(tbox, t.test, 'test-'+t.id, (res)=>{
      const s = store.topic(t.id);
      s.test = res;
      store.save();
    });
  });
  $('[data-retry-test]', tbox).addEventListener('click', ()=>{
    $$('input[type=radio]', tbox).forEach(r=> r.checked = false);
    $$('.opt', tbox).forEach(o=> o.classList.remove('correct','wrong'));

  $$('[data-stars="'+t.id+'"] span').forEach(sp=>{
    sp.addEventListener('click', ()=>{

      const s = store.topic(t.id);
      s.self = v;
      s.done = true;
      store.save();
      $$('[data-stars="'+t.id+'"] span').forEach(x=> x.classList.toggle('on', parseInt(x.dataset.v,10) <= v));
      $('[data-star-txt]').textContent = 'Бағаң: '+v+'/5 — нәтиже сақталды ✓';
    });
  });
}

function pageLab(){
  let h = '<h1>🧪 Spreadsheet Lab — Практикалық зертхана</h1>';
  h += '<p class="muted">7 практикалық жұмыс. Әр жұмыста мақсат, қажетті деректер, орындау қадамдары, интерактивті жұмыс аймағы және тексеру бар.</p>';
  PRACTICE.forEach((p,i)=>{
    const done = store.data.practice[p.id];
    h += '<div class="card" data-lab="'+p.id+'">';
    h += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">';
    h += '<h2 style="margin:0">'+p.icon+' '+p.title+'</h2>';
    h += done ? '<span class="pill">✓ Орындалды</span>' : '<span class="pill y">Орындалмаған</span>';
    h += '</div>';
    h += '<p style="margin-top:10px"><b>Мақсаты:</b> '+p.goal+'</p>';
    h += '<p><b>Қажетті деректер:</b> '+p.data+'</p>';
    h += '<p style="margin-bottom:4px"><b>Орындау қадамдары:</b></p><ol>';
    p.steps.forEach(s=> h += '<li>'+s+'</li>');
    h += '</ol>';
    h += '<p style="margin-bottom:4px"><b>Интерактивті жұмыс аймағы:</b></p>';
    h += p.html;
    h += '<div class="fields" style="margin-top:14px">';
    p.fields.forEach((f,fi)=>{
      const hasHtmlInputs = p.html.indexOf('data-f=') !== -1;
      if(hasHtmlInputs) return;
      h += '<div class="field" data-fi="'+fi+'"><label>'+(fi+1)+') '+f.label+'</label>'
        + '<input type="text" data-pf="'+fi+'" placeholder="жауабыңды жаз"><span class="mark"></span></div>';
    });
    h += '</div>';
    h += '<div style="margin-top:12px"><button class="btn" data-check-lab>Тексеру</button></div>';
    h += '<div class="fb" data-lab-fb style="display:none"></div>';
    h += '<p class="small muted" style="margin-top:10px"><b>Бағалау критерийлері:</b> '+p.criteria+'</p>';
    h += '</div>';
  });
  view.innerHTML = h;
  window.scrollTo(0,0);
  initWidgets(view);

  PRACTICE.forEach(p=>{
    const box = $('[data-lab="'+p.id+'"]');
    $('[data-check-lab]', box).addEventListener('click', ()=>{
      const hasHtmlInputs = p.html.indexOf('data-f=') !== -1;
      const selector = hasHtmlInputs ? '[data-f]' : '[data-pf]';
      const inputs = $$(selector, box);
      let correct = 0;
      const details = [];
      inputs.forEach(inp=>{
        const i = parseInt(hasHtmlInputs ? inp.dataset.f : inp.dataset.pf, 10);
        const f = p.fields[i];
        if(!f) return;
        const answers = (typeof f.a === 'function') ? f.a() : f.a;
        const ok = String(inp.value).trim() !== '' && answers.some(a=> match(inp.value, a));
        if(ok) correct++;
        details.push({label:f.label, ok:ok, val:inp.value, ans:answers[0]});
        const fe = inp.closest('.field');
        if(fe){
          fe.classList.toggle('ok', ok);
          fe.classList.toggle('no', !ok);
          const m = $('.mark', fe);
          if(m) m.textContent = ok ? '✓' : '✗';
        }else{
          inp.style.borderColor = ok ? '#2E8B62' : '#FF6B5B';
          inp.style.background = ok ? '#F1FAF5' : '#FFF4F2';
        }
      });
      const total = p.fields.length;
      const pct = Math.round(correct/total*100);
      const fb = $('[data-lab-fb]', box);
      fb.style.display = 'block';
      fb.className = 'fb ' + (pct === 100 ? 'good' : (pct >= 60 ? 'good' : 'bad'));
      let msg = pct === 100
        ? '🎉 Тамаша! Практикалық жұмыс толық орындалды ('+correct+'/'+total+').'
        : 'Дұрыс жауап: '+correct+'/'+total+' ('+pct+'%). '+(pct>=60?'Аздап түзету керек.':'Қадамдарды қайта орындап көр.');
      let list = '';
      details.forEach(d=>{
        if(!d.ok) list += '<li>«'+esc(d.label)+'» — сенің жауабың: <b>'+(d.val?esc(d.val):'бос')+'</b>, дұрысы: <b>'+esc(d.ans)+'</b></li>';
      });
      fb.innerHTML = '<b>'+msg+'</b>' + (list ? '<ul>'+list+'</ul>' : '');
      if(pct >= 60){
        store.data.practice[p.id] = true;
        store.save();
      }
    });
  });
}

/* ---------- МЕНІҢ НӘТИЖЕЛЕРІМ ---------- */
function pageProgress(){
  let h = '<h1>📊 Менің нәтижелерім</h1>';
  let sumPct = 0, cnt = 0;
  let testsDone = 0;

  h += '<div class="card"><h2>Аяқталған тақырыптар</h2>';
  TOPICS.forEach(t=>{
    const st = store.topic(t.id);
    if(st.test){ sumPct += st.test.percent; cnt++; }
    if(st.test) testsDone++;
    h += '<div class="prow">';
    h += '<div><b>'+t.code+'.</b> '+t.icon+' '+t.title+'</div>';
    h += '<div style="display:flex;gap:8px;flex-wrap:wrap">';
    h += st.done ? '<span class="pill">✓ Аяқталды</span>' : '<span class="pill y">Оқылмаған</span>';
    h += st.self ? '<span class="pill cy">Өзін-өзі бағалау: '+st.self+'/5</span>' : '';
    h += st.test ? '<span class="pill '+(st.test.percent>=75?'':'y')+'">Тест: '+st.test.percent+'% ('+st.test.correct+'/'+st.test.total+')</span>' : '<span class="pill y">Тест: —</span>';
    h += '</div></div>';
  });
  h += '</div>';

  /* практика */
  h += '<div class="card"><h2>Практикалық жұмыстар</h2>';
  PRACTICE.forEach(p=>{
    const d = !!store.data.practice[p.id];
    h += '<div class="prow"><div>'+p.icon+' '+p.title+'</div>'
      + (d ? '<span class="pill">✓ Орындалды</span>' : '<span class="pill y">Орындалмаған</span>') + '</div>';
  });
  h += '</div>';

  /* орташа */
  const avg = cnt ? Math.round(sumPct/cnt) : 0;
  h += '<div class="card pastel-g"><h2>Жалпы көрсеткіштер</h2>';
  h += '<p><b>Тапсырылған тақырыптық тесттер:</b> '+testsDone+' / 7</p>';
  h += '<p><b>Тақырыптық тесттердің орташа пайызы:</b> '+avg+'%</p>';
  h += '<div class="bar"><i style="width:'+avg+'%"></i></div>';
  if(store.data.final){
    const f = store.data.final;
    let g = f.percent>=90 ? 'Өте жақсы! 🏆' : f.percent>=75 ? 'Жақсы! 👍' : f.percent>=50 ? 'Қайталап оқы. 📖' : 'Теорияны қайта қарап, тағы тапсыр. 📚';
    h += '<p style="margin-top:14px"><b>Қорытынды тест:</b> '+f.percent+'% ('+f.correct+'/'+f.total+') — '+g+'</p>';
    h += '<div class="bar"><i style="width:'+f.percent+'%"></i></div>';
  }else{
    h += '<p style="margin-top:14px" class="muted">Қорытынды тест әлі тапсырылмаған.</p>';
  }
  h += '</div>';

  h += '<div class="card"><h3 style="margin-top:0">♻️ Нәтижелерді тазалау</h3>'
    + '<p class="small muted">Барлық сақталған нәтижелер осы браузерден өшіріледі.</p>'
    + '<button class="btn alt" id="resetBtn">Барлығын тазалау</button></div>';

  h += '<p class="note">Нәтижелер браузердің <b>localStorage</b> жадында сақталады. Бетті жаңартқанда олар жоғалмайды. Егер басқа компьютерде немесе браузерде ашсаң, нәтижелер көрінбейді.</p>';

  view.innerHTML = h;
  $('#resetBtn').addEventListener('click', ()=>{
    if(confirm('Барлық нәтижелерді тазалауға сенімдісің бе?')){
      store.reset();
      go('progress');
      render();
    }
  });
}

/* ============================================================
   10. РОУТЕР
   ============================================================ */
function render(){
  const hash = location.hash.replace(/^#\//, '') || 'home';
  const parts = hash.split('/');
  const page = parts[0];
  const param = parts[1];

  if(page === 'topic' && param){ renderNav('topics'); pageTopic(param); return; }

  switch(page){
    case 'home': renderNav('home'); pageHome(); break;
    case 'topics': renderNav('topics'); pageTopics(); break;
    case 'lab': renderNav('lab'); pageLab(); break;
    case 'tests': renderNav('tests'); pageTests(); break;
    case 'final': renderNav('final'); pageFinal(); break;
    case 'progress': renderNav('progress'); pageProgress(); break;
    default: renderNav('home'); pageHome();
  }
}

window.addEventListener('hashchange', render);
render();
</script>
